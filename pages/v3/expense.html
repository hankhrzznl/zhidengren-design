<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>记账 · 执灯人</title>
<style>
  :root{
    --bg:#0B0F1A; --card:#121826; --sheet:#1A2332; --line:rgba(232,234,242,.08);
    --text-1:#E8EAF2; --text-2:#9AA3B5; --text-3:#5A6478;
    --brand:#4DC3FF; --brand-ink:#06121F; --red:#FF5C4D; --green:#3EB575;
  }
  [data-theme="light"]{
    --bg:#F7F4EF; --card:#FFFFFF; --sheet:#F2ECE3; --line:rgba(38,34,30,.10);
    --text-1:#26221E; --text-2:#6E675E; --text-3:#A39C90;
    --brand:#002FA7; --brand-ink:#FFFFFF; --red:#D64545; --green:#2F8F5B;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text-1);font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;padding:20px 16px 40px}
  h1{font-size:22px;margin:0;letter-spacing:.02em}
  .head{display:flex;align-items:baseline;justify-content:space-between;margin:4px 0 14px}
  .rep-link{font-size:11.5px;color:var(--brand);text-decoration:none;padding:2px 4px}
  .head-links{display:flex;align-items:baseline;gap:10px}
  .stat{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 18px 14px}
  .eye{position:absolute;top:10px;right:10px;width:34px;height:34px;padding:7px;border:0;background:none;color:var(--text-3);cursor:pointer;border-radius:50%}
  .eye svg{width:20px;height:20px;display:block}
  .eye:active{background:var(--sheet)}
  .stat .lab{font-size:11px;color:var(--text-3);letter-spacing:.14em}
  .stat .net{font-size:40px;font-weight:650;line-height:1.1;margin:6px 0 10px;font-variant-numeric:tabular-nums}
  .stat .net small{font-size:12px;color:var(--text-3);margin-left:6px;font-weight:400}
  .stat .row{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--text-2)}
  .stat .row b{display:block;font-size:15px;color:var(--text-1);font-variant-numeric:tabular-nums;margin-top:2px}
  .stat .row .neg b{color:var(--red)}
  .sec{display:flex;align-items:baseline;justify-content:space-between;margin:20px 0 9px}
  .sec h2{font-size:12px;margin:0;color:var(--text-3);letter-spacing:.16em;font-weight:600}
  .sec button{font:inherit;font-size:11.5px;color:var(--brand);background:none;border:0;padding:2px 4px;cursor:pointer}
  .strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .strip::-webkit-scrollbar{display:none}
  .acct{flex:none;min-width:118px;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--card);cursor:pointer;transition:border-color .16s;text-align:left}
  .acct.on{border-color:var(--brand)}
  .acct .n{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:6px}
  .acct .n i{width:7px;height:7px;border-radius:50%;flex:none}
  .acct .v{font-size:18px;font-weight:650;margin-top:6px;font-variant-numeric:tabular-nums;display:block}
  .acct .v.credit{color:var(--red)}
  .acct .s{font-size:10px;color:var(--text-3);margin-top:2px;display:block}
  .acct .d{font-size:9.5px;color:var(--text-3);margin-top:1px;display:block;white-space:nowrap}
  .remind-card{margin-top:12px}
  .monthly-card{margin-top:12px}
  .monthly-text{margin:2px 0 8px;font-size:12px;line-height:1.7;color:var(--text-2)}
  .monthly-btns{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11.5px}
  .monthly-btns button{border:1px solid var(--line);background:transparent;color:var(--text-2);border-radius:99px;padding:5px 10px;font:inherit;font-size:11px;cursor:pointer}
  .remind-head{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-2);margin-bottom:8px}
  .remind-head span:last-child{color:var(--text-3);font-size:10.5px}
  .remind-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:12px}
  .remind-row:first-child{border-top:0}
  .remind-row .rn{flex:1;min-width:0}
  .remind-row .rn b{display:block;font-weight:500;color:var(--text-1)}
  .remind-row .rn span{font-size:10.5px;color:var(--text-3)}
  .remind-row .rd{font-size:10.5px;color:var(--text-2);background:var(--sheet);border-radius:99px;padding:3px 8px;white-space:nowrap}
  .remind-row .rd.hot{color:var(--red)}
  .remind-row .ra{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
  .month-card{margin-top:12px}
  .month-top{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-2)}
  .month-spend{color:var(--text-3)}
  .month-input{display:flex;gap:8px;margin:8px 0}
  .month-input input{flex:1;min-width:0;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--sheet);color:var(--text-1);font-size:12.5px;padding:0 10px;outline:none}
  .month-input button{height:36px;padding:0 14px;border-radius:10px;border:0;background:var(--brand);color:var(--brand-ink);font-size:12px;font-weight:600;cursor:pointer}
  .month-meta{font-size:11px;color:var(--text-3);margin-top:6px}
  .cats{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .cat-pill{font-size:10.5px;color:var(--text-2);background:var(--sheet);border-radius:99px;padding:4px 8px}
  .save.ghost{background:transparent;color:var(--text-2);border:1px solid var(--line);margin-top:8px}
  .to-lab{display:flex;align-items:center;font-size:11.5px;color:var(--text-3)}
  .amount{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--line);padding:2px 0 10px;margin-bottom:10px}
  .amount span{font-size:18px;color:var(--text-2)}
  .amount .paste{flex:none;height:32px;padding:0 10px;border-radius:99px;border:1px solid var(--line);background:var(--sheet);color:var(--text-2);font:inherit;font-size:11px;cursor:pointer}
  .amount input{flex:1;min-width:0;border:0;background:transparent;color:var(--text-1);font-size:30px;font-weight:650;outline:none;font-variant-numeric:tabular-nums}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  .chip{font:inherit;font-size:11.5px;padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--text-2);cursor:pointer}
  .chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
  .fields{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
  .fields select,.fields input{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--sheet);color:var(--text-1);font-size:13px;padding:0 10px;outline:none}
  .fields input{flex:1;min-width:110px}
  .fields select{min-width:120px}
  .save{width:100%;height:44px;border:0;border-radius:12px;background:var(--brand);color:var(--brand-ink);font-size:14px;font-weight:650;margin-top:4px;cursor:pointer}
  .due-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 0 12px;border-bottom:1px solid var(--line);margin-bottom:4px;font-size:12.5px;color:var(--text-2)}
  .due-head b{font-size:20px;color:var(--text-1);font-variant-numeric:tabular-nums;margin-left:4px}
  .pay-btn{height:32px;padding:0 12px;border-radius:99px;border:0;background:var(--brand);color:var(--brand-ink);font:inherit;font-size:11.5px;font-weight:600;cursor:pointer}
  .pay-btn[disabled]{background:var(--sheet);color:var(--text-3);cursor:default}
  .upcoming{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .up{font-size:10.5px;color:var(--text-3);background:var(--sheet);border-radius:99px;padding:4px 8px;font-variant-numeric:tabular-nums}
  .up.on{color:var(--brand)}
  .plan-actions{display:flex;gap:12px;margin-top:8px}
  .pbtn{font:inherit;font-size:11px;color:var(--brand);background:none;border:0;padding:2px 0;cursor:pointer}
  .pbtn.danger{color:var(--text-3)}
  .pbtn.danger:hover{color:var(--red)}
  .due-tag{font-style:normal;font-size:9.5px;color:var(--brand-ink);background:var(--brand);border-radius:99px;padding:1px 6px;margin-left:4px;font-weight:600}
  .plan{display:flex;flex-direction:column;gap:8px}
  .plan-row{padding:12px 0;border-top:1px solid var(--line)}
  .plan-row:first-child{border-top:0;padding-top:2px}
  .plan-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:13px}
  .plan-top b{font-variant-numeric:tabular-nums}
  .plan-sub{font-size:11px;color:var(--text-3);margin-top:3px}
  .bar{height:4px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;border-radius:99px;background:var(--brand)}
  .repay{margin-top:8px;font:inherit;font-size:11.5px;color:var(--brand);background:none;border:0;padding:0;cursor:pointer}
  .repay[disabled]{color:var(--text-3);cursor:default}
  .list{display:flex;flex-direction:column}
  .item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:12.5px}
  .item:first-child{border-top:0}
  .item .ic{width:28px;height:28px;border-radius:9px;background:var(--sheet);display:flex;align-items:center;justify-content:center;font-size:12px;flex:none;color:var(--text-2)}
  .item .mid{flex:1;min-width:0}
  .item .mid b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .mid span{font-size:10.5px;color:var(--text-3)}
  .item .amt{font-weight:650;font-variant-numeric:tabular-nums}
  .item .amt.in{color:var(--green)}
  .empty{padding:18px;text-align:center;color:var(--text-3);font-size:12px;border:1px dashed var(--line);border-radius:12px}
  .form{display:none;margin-top:10px}
  .form.on{display:block}
  .form-hint{margin:2px 0 10px;font-size:10.5px;line-height:1.6;color:var(--text-3)}
  .acct-empty{width:100%;padding:16px;border:1px dashed var(--line);border-radius:16px;background:var(--card);color:var(--text-2);font:inherit;font-size:12.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
  .acct-empty b{color:var(--brand);font-size:13px}
  .acct-empty span{font-size:10.5px;color:var(--text-3)}
  .wipe{display:block;width:100%;margin:22px 0 4px;padding:10px;border:0;background:none;color:var(--text-3);font:inherit;font-size:11.5px;cursor:pointer}
  .wipe:hover{color:var(--red)}
  .quick-bar{position:fixed;left:16px;right:16px;bottom:20px;z-index:50;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.35);font-size:12px;color:var(--text-1)}
  .quick-bar span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .quick-bar button{border:0;background:var(--brand);color:var(--brand-ink);border-radius:99px;padding:5px 12px;font:inherit;font-size:11.5px;font-weight:600;cursor:pointer}
  .toast{position:fixed;left:50%;bottom:16px;transform:translate(-50%,10px);opacity:0;pointer-events:none;background:var(--brand);color:var(--brand-ink);padding:8px 16px;border-radius:99px;font-size:12px;transition:all .2s}
  .toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
  <div class="head"><h1>记账</h1><span class="head-links"><a class="rep-link" href="quick-setup.html">自动记账</a><a class="rep-link" href="expense-report.html">月报 →</a></span></div>

  <div class="stat">
    <div class="lab">净资产</div>
    <button type="button" class="eye" id="eye" aria-label="隐藏金额" aria-pressed="false" title="隐藏 / 显示金额"></button>
    <div class="net" id="stat-net"><span id="stat-net-v">¥0</span><small>资产 − 信用待还</small></div>
    <div class="row">
      <div>资产合计<b id="stat-assets">¥0</b></div>
      <div class="neg">信用待还<b id="stat-credit">¥0</b></div>
      <div>本月支出<b id="stat-month">¥0</b></div>
    </div>
  </div>

  <div class="card remind-card" id="remind-card" style="display:none">
    <div class="remind-head"><span>账单 / 还款提醒</span><span id="remind-note"></span></div>
    <div id="remind-list"></div>
  </div>

  <div class="card monthly-card" id="monthly-card" style="display:none">
    <div class="remind-head"><span>每月对账</span><a class="rep-link" href="quick-setup.html">设置</a></div>
    <p class="monthly-text" id="monthly-text"></p>
    <div class="monthly-btns"><a class="rep-link" href="bill-import.html">去导入 →</a><button type="button" id="monthly-done">本月已完成</button></div>
  </div>

  <div class="card month-card">
    <div class="month-top">
      <span>本月预算</span>
      <span class="month-spend" id="month-spend">已花 ¥0</span>
    </div>
    <div class="month-input">
      <input id="budget-input" inputmode="decimal" placeholder="设一个预算，如 3000">
      <button type="button" id="budget-save">保存</button>
    </div>
    <div class="bar"><i id="budget-bar" style="width:0%"></i></div>
    <div class="month-meta" id="month-meta">还没设预算。</div>
    <div class="cats" id="cat-top"></div>
  </div>

  <div class="sec"><h2>账户</h2><span><button type="button" id="acc-edit">编辑账户</button><button type="button" id="acc-add">＋ 新账户</button></span></div>
  <div class="strip" id="acct-strip"></div>

  <div class="form card" id="acc-form">
    <div class="fields">
      <input id="acc-name" maxlength="12" placeholder="账户名，如 微信钱包">
      <select id="acc-type">
        <option value="asset">资产</option>
        <option value="credit">信用</option>
      </select>
    </div>
    <div class="fields">
      <input id="acc-opening" inputmode="decimal" placeholder="当前余额 / 已用">
      <input id="acc-limit" inputmode="decimal" placeholder="额度（信用）">
    </div>
    <div class="fields" id="acc-days" style="display:none">
      <input id="acc-billday" inputmode="numeric" placeholder="账单日（1–28）">
      <input id="acc-repayday" inputmode="numeric" placeholder="还款日（1–28）">
    </div>
    <p class="form-hint" id="acc-hint"></p>
    <button class="save" type="button" id="acc-save">保存账户</button>
    <button class="save ghost" type="button" id="acc-cancel" style="display:none">取消编辑</button>
  </div>

  <div class="sec"><h2>记一笔</h2><span></span></div>
  <div class="card">
    <div class="amount"><span>¥</span><input id="amt-input" inputmode="decimal" placeholder="0.00" autocomplete="off"><button type="button" class="paste" id="paste-btn">粘贴账单</button></div>
    <div class="chips" id="type-chips">
      <button class="chip on" type="button" data-type="expense">支出</button>
      <button class="chip" type="button" data-type="income">收入</button>
      <button class="chip" type="button" data-type="transfer">转账</button>
    </div>
    <div class="fields">
      <select id="rec-account"></select>
      <input id="rec-note" maxlength="30" placeholder="备注（可选）">
    </div>
    <div class="fields" id="to-row" style="display:none">
      <span class="to-lab">转入</span>
      <select id="rec-to"></select>
    </div>
    <div class="chips" id="cat-chips">
      <button class="chip on" type="button" data-cat="日常">日常</button>
      <button class="chip" type="button" data-cat="餐饮">餐饮</button>
      <button class="chip" type="button" data-cat="交通">交通</button>
      <button class="chip" type="button" data-cat="购物">购物</button>
      <button class="chip" type="button" data-cat="房租">房租</button>
      <button class="chip" type="button" data-cat="还款">还款</button>
    </div>
    <button class="save" type="button" id="rec-save">记下</button>
  </div>

  <div class="sec"><h2>分期</h2><button type="button" id="plan-add">＋ 分期</button></div>
  <div class="card" id="plan-card">
    <div class="due-head">
      <span>本月应还 <b id="due-month">¥0</b></span>
      <button type="button" class="pay-btn" id="pay-month">还本期</button>
    </div>
    <div class="plan" id="plan-list"></div>
    <div class="upcoming" id="plan-upcoming"></div>
    <div class="form" id="plan-form">
      <div class="fields">
        <input id="plan-name" maxlength="12" placeholder="商品名称，如 耳机">
        <input id="plan-periods" inputmode="numeric" placeholder="期数">
      </div>
      <div class="fields">
        <input id="plan-monthly" inputmode="decimal" placeholder="每期还多少">
        <select id="plan-account"></select>
      </div>
      <div class="fields">
        <span class="to-lab">首期</span>
        <input id="plan-start" type="month" aria-label="首期账单月">
        <button class="pbtn" type="button" id="plan-cancel" style="display:none">取消修改</button>
      </div>
      <button class="save" type="button" id="plan-save">开始分期</button>
    </div>
  </div>

  <div class="sec"><h2>流水</h2><button type="button" id="filter-clear" style="display:none">看全部</button></div>
  <div class="card"><div class="list" id="rec-list"></div></div>

  <div class="quick-bar" id="quick-bar" style="display:none"><span id="quick-text"></span><button type="button" id="quick-undo">撤销</button></div>
  <button type="button" class="wipe" id="wipe">清空记账数据（账户 / 流水 / 分期）</button>
  <div class="toast" id="toast"></div>

<script src="../core/store.js"></script>
<script src="../core/ledger.js"></script>
<script src="../core/bill-parse.js"></script>
<script src="../core/cloud-inbox.js"></script>
<script src="../core/reminder.js"></script>
<script>
(function () {
  var L = window.LightLedger;
  var selected = null;
  var type = 'expense';
  var cat = '日常';
  var editing = null;
  var HIDE_KEY = 'lifeflow-money-hidden';
  var hidden = false;
  try { hidden = localStorage.getItem(HIDE_KEY) === '1'; } catch (e) {}
  var $ = function (s) { return document.querySelector(s); };
  var toastEl = $('#toast'), toastTimer = null;

  var EYE_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.7"/></svg>';
  var EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.7"/><path d="M4 20 20 4"/></svg>';

  function money(n) {
    if (hidden) return '••••';
    n = Number(n) || 0;
    var sign = n < 0 ? '−' : '';
    return sign + '¥' + (Math.round(Math.abs(n) * 100) / 100).toLocaleString('zh-CN', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  }

  function applyEye() {
    var b = $('#eye');
    if (b) {
      b.innerHTML = hidden ? EYE_OFF : EYE_ON;
      b.setAttribute('aria-pressed', hidden ? 'true' : 'false');
      b.setAttribute('aria-label', hidden ? '显示金额' : '隐藏金额');
    }
    var bi = $('#budget-input');
    if (bi) bi.type = hidden ? 'password' : 'text';
  }
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('on');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastEl.classList.remove('on'); }, 1400);
  }
  function accountName(id) {
    var a = L.accountById(L.load(), id);
    return a ? a.name : '账户';
  }

  function renderStats() {
    var t = L.totals();
    $('#stat-net-v').textContent = money(t.net);
    $('#stat-assets').textContent = money(t.assets);
    $('#stat-credit').textContent = money(t.creditUsed);
    $('#stat-month').textContent = money(t.monthSpend);
  }

  function renderMonth() {
    var t = L.totals();
    var budget = L.budgetOf();
    var pct = budget > 0 ? Math.min(100, Math.round(t.monthSpend / budget * 100)) : 0;
    $('#month-spend').textContent = '已花 ' + money(t.monthSpend);
    if (document.activeElement !== $('#budget-input')) $('#budget-input').value = budget > 0 ? budget : '';
    $('#budget-bar').style.width = pct + '%';
    $('#budget-bar').style.background = (budget > 0 && t.monthSpend > budget) ? 'var(--red)' : 'var(--brand)';
    $('#month-meta').textContent = budget > 0
      ? ('预算 ' + money(budget) + ' · 剩 ' + money(budget - t.monthSpend) + (hidden ? '' : '（' + pct + '%）'))
      : ('本月支出 ' + money(t.monthSpend) + ' · 收入 ' + money(t.monthIncome) + '；设个预算更好控。');
    var cats = L.categoryBreakdown(null, 3);

  function renderPlans() {
    var db = L.load();
    var due = L.monthlyDue();
    var bill = L.monthlyDue(null, true);
    var paidThisMonth = Math.max(0, bill.total - due.total);
    var dueByAcc = {};
    due.items.forEach(function (it) { dueByAcc[it.accountId] = (dueByAcc[it.accountId] || 0) + it.monthly; });
    $('#due-month').textContent = money(due.total);
    var payBtn = $('#pay-month');
    payBtn.disabled = due.items.length === 0;
    payBtn.textContent = due.total > 0 ? '还本期 ' + money(due.total) : (paidThisMonth > 0 ? '本月已还 ' + money(paidThisMonth) : '本月无需还');
    $('#plan-upcoming').innerHTML = L.upcoming(6).map(function (u) {
      return '<span class="up' + (u.month === due.month ? ' on' : '') + '">' + u.label + ' ' + money(u.total) + '</span>';
    }).join('');

    var list = db.plans.slice().sort(function (a, b) { return String(L.planStartMonth(b)).localeCompare(String(L.planStartMonth(a))); });
    var el = $('#plan-list');
    if (!list.length) { el.innerHTML = '<div class="empty">还没有分期。花呗/白条的商品分期记在这里，每月按各自期数还。</div>'; return; }
    el.innerHTML = list.map(function (p) {
      var done = p.paid >= p.periods;
      var pct = Math.round(p.paid / p.periods * 100);
      var dueThis = due.items.some(function (i) { return i.planId === p.id; });
      var accObj = L.accountById(db, p.accountId);
      var sm = L.planStartMonth(p);
      var monthLabel = Number(sm.split('-')[1]) + ' 月';
      var repayDay = accObj ? (accObj.repayDay || 10) : 10;
      return '<div class="plan-row">' +
        '<div class="plan-top"><span>' + accountName(p.accountId) + ' · ' + (p.name || '分期') + (dueThis && !done ? ' <em class="due-tag">本月</em>' : '') + '</span><b>' + money(p.monthly) + ' × ' + p.periods + ' 期</b></div>' +
        '<div class="plan-sub">' + (p.settled ? '已提前结清 · ' : '') + '首期 ' + monthLabel + ' · 每月 ' + repayDay + ' 日还 · 已还 ' + p.paid + '/' + p.periods + ' 期 · 剩余 ' + money(L.planRemaining(p)) + (p.feeRate ? ' · 费率 ' + p.feeRate + '%' : '') + '</div>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
        '<button class="repay" type="button" data-plan="' + p.id + '"' + (done ? ' disabled' : '') + '>' + (done ? '已还清' : '还这一笔（从资产账户扣）') + '</button>' +
        '<div class="plan-actions">' +
        (!done ? '<button class="pbtn" type="button" data-settle="' + p.id + '">提前结清 ' + money(L.planRemaining(p)) + '</button>' : '') +
        '<button class="pbtn" type="button" data-edit="' + p.id + '">编辑</button><button class="pbtn danger" type="button" data-del="' + p.id + '">删除</button></div>' +
        '</div>';
    }).join('');
    Array.prototype.forEach.call(el.querySelectorAll('[data-edit]'), function (b) {
      b.addEventListener('click', function () {
        var plan = L.plans().find(function (x) { return x.id === b.getAttribute('data-edit'); });
        if (plan) openPlanForm(plan);
      });
    });
    Array.prototype.forEach.call(el.querySelectorAll('[data-del]'), function (b) {
      b.addEventListener('click', function () {
        if (!confirm('删除这笔分期？它带来的本金和已还记录会一并撤销，账户余额会恢复。')) return;
        L.deletePlan(b.getAttribute('data-del'));
        editingPlan = null;
        $('#plan-form').classList.remove('on');
        renderAll(); toast('分期已删除');
      });
    });
    Array.prototype.forEach.call(el.querySelectorAll('[data-settle]'), function (b) {
      b.addEventListener('click', function () {
        var db2 = L.load();
        var plan = db2.plans.find(function (x) { return x.id === b.getAttribute('data-settle'); });
        if (!plan) return;
        var amount = L.planRemaining(plan);
        var left = plan.periods - plan.paid;
        if (!confirm('提前结清「' + (plan.name || '分期') + '」？剩 ' + left + ' 期，共 ' + money(amount) + '，会从第一个资产账户一次性扣。')) return;
        var from = db2.accounts.filter(function (a) { return a.type === 'asset'; })[0];
        if (!from) { toast('先建一个资产账户'); return; }
        var r = L.settlePlan(plan.id, from.id);
        if (!r) { toast('这笔分期已经结清了'); return; }
        writeFact('提前结清', r.amount);
        renderAll(); toast('已提前结清 ' + money(r.amount));
      });
    });
    Array.prototype.forEach.call(el.querySelectorAll('.repay[data-plan]'), function (b) {
      b.addEventListener('click', function () {
        var db2 = L.load();
        var plan = db2.plans.find(function (x) { return x.id === b.getAttribute('data-plan'); });
        if (!plan) return;
        var from = db2.accounts.filter(function (a) { return a.type === 'asset'; })[0];
        if (!from) { toast('先建一个资产账户'); return; }
        var r = L.repayPlan(plan.id, from.id);
        if (!r) { toast('这一期已经还过了'); return; }
        writeFact('还款', r.monthly);
        renderAll(); toast('已还一期 ' + money(r.monthly));
      });
    });
  }

  function writeFact(label, amount) {
    try {
      if (!window.LightStore) return null;
      var d = new Date();
      var key = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
      return window.LightStore.record({ mod: '记账', metric: 'entries', value: 1, date: key, meta: { label: label, amount: amount } });
    } catch (e) { return null; }
  }

  /* 快捷指令 / URL 记账：expense.html?quick=38&cat=餐饮&note=午饭&account=微信 */
  var quickTimer = null, lastQuick = null;
  function quickAddFromURL() {
    var q;
    try { q = new URLSearchParams(location.search); } catch (e) { return null; }
    var amt = Number(q.get('quick') || q.get('amount') || '');
    if (!(amt > 0)) return null;
    var db = L.load();
    var token = q.get('account') || '';
    var acc = db.accounts.find(function (a) { return a.id === token; }) ||
      db.accounts.find(function (a) { return a.name === token; }) ||
      db.accounts.filter(function (a) { return a.type === 'asset'; })[0];
    if (!acc) { toast('快捷记账：先添加一个账户'); return null; }
    var type = q.get('type') === 'income' ? 'income' : 'expense';
    var cat = q.get('cat') || q.get('category') || (type === 'income' ? '收入' : '日常');
    var note = q.get('note') || q.get('memo') || '';
    var rawDate = q.get('date');
    var tx = L.addTx({
      type: type, amount: amt, accountId: acc.id,
      category: cat, note: note,
      date: rawDate ? normalizeDate(rawDate) : undefined
    });
    if (!tx) { toast('快捷记账失败'); return null; }
    var fact = writeFact(type === 'income' ? '收入' : cat, amt);
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    return { tx: tx, fact: fact, accName: acc.name };
  }

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function toInputMonth(m) {
    var a = String(m || '').split('-').map(Number);
    if (a.length < 2 || !a[0]) return '';
    return a[0] + '-' + String(a[1]).padStart(2, '0');
  }
  function nextMonthInput() {
    var d = new Date();
    d.setMonth(d.getMonth() + 1);
    return toInputMonth(d.getFullYear() + '-' + (d.getMonth() + 1));
  }
  function normalizeDate(s) {
    var a = String(s || '').split('-').map(Number);
    return (a[0] || 0) + '-' + (a[1] || 1) + '-' + (a[2] || 1);
  }

    editingPlan = null;
    $('#plan-form').classList.remove('on');

  $('#plan-save').addEventListener('click', function () {

      ? L.updatePlan(editingPlan, { name: name, monthly: monthly, periods: periods, accountId: accId, startMonth: startMonth })
      : L.addPlan({ accountId: accId, monthly: monthly, periods: periods, name: name, startMonth: startMonth });

    toast(wasEdit ? '已更新：' + money(p.monthly) + ' × ' + p.periods + ' 期' : '已建：' + money(p.monthly) + ' × ' + p.periods + ' 期');
  });

  $('#pay-month').addEventListener('click', function () {
    var db = L.load();
    var from = db.accounts.filter(function (a) { return a.type === 'asset'; })[0];
    if (!from) { toast('先建一个资产账户'); return; }
    var r = L.payMonth(null, from.id);
    if (!r.count) { toast('本月没有待还分期'); return; }
    writeFact('还款', r.total);
    renderAll(); toast('已还 ' + r.count + ' 笔 · ' + money(r.total));
  });

  $('#filter-clear').addEventListener('click', function () { selected = null; renderAccounts(); renderList(); });

  $('#budget-save').addEventListener('click', function () {
    var v = Number($('#budget-input').value);
    L.setBudget(v > 0 ? v : 0);
    renderMonth();
    toast(v > 0 ? '本月预算 ' + money(v) : '已清空预算');
  });
  $('#budget-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') $('#budget-save').click();
  });

  $('#monthly-done').addEventListener('click', function () {
    if (!window.LightReminder) return;
    window.LightReminder.markDone();
    renderMonthly();
    toast('本月对账已完成');
  });

  L.ensurePlanModel();
  L.cleanDemo();
  var auto = L.autoRepayDue();
  var quick = quickAddFromURL();
  syncAccType();
  applyEye();
  renderAll();
  if (quick) showQuick(quick);
  if (auto) toast('自动记了 ' + auto + ' 期分期');
  if (window.LightInbox) {
    window.LightInbox.pull().then(function (r) { if (r && r.added) { renderAll(); toast('云收件箱记了 ' + r.added + ' 笔'); } }).catch(function () {});
  }

  $('#eye').addEventListener('click', function () {
    hidden = !hidden;
    try { localStorage.setItem(HIDE_KEY, hidden ? '1' : '0'); } catch (e) {}
    applyEye(); renderAll();
  });

  window.addEventListener('storage', function (e) {
    if (e.key === HIDE_KEY) { hidden = e.newValue === '1'; applyEye(); renderAll(); }
  });

  $('#wipe').addEventListener('click', function () {
    if (!confirm('清空记账的全部账户、流水和分期？此操作不可撤销。')) return;
    L.reset();
    selected = null; editing = null;
    $('#acc-form').classList.remove('on');
    renderAll();
    toast('已清空');
  });
})();
</script>
</body>
</html>
