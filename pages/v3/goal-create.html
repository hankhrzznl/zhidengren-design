<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>新建目标 · LifeFlow</title>
<meta name="theme-color" content="#F7F4EF">
<style id="theme-vars">/* ============================================================
   LifeFlow · 目标系统 UI 基座（v3 · 平静 / 高级 / 被温柔对待）
   ------------------------------------------------------------
   设计哲学：降噪、升温、变柔软。保留品牌蓝身份，但让整体像一间
   被温柔照料的私人空间，而非功能密集的控制台。
   铁律：全 App 禁用纯黑 #000 与纯白 #FFF；阴影用彩色叠加，禁灰阴影。
   ============================================================ */

/* ============ 1. RESET ============ */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { min-height: 100vh;  background: var(--bg); }

button { font-family: inherit; font-size: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
ul, ol { list-style: none; }
img, svg { display: block; max-width: 100%; }

/* ============ 2. LIGHT TOKENS（日间 · 暖中性 + 品牌蓝） ============ */
:root {
  color-scheme: light;

  /* —— 表面 —— */
  --bg: #FAF6F0;            /* 页面底 · 暖白（Headspace 暖底） */
  --bg-glow-1: rgba(0, 47, 167, 0.07);     /* 顶部克莱因蓝光晕 */
  --bg-glow-2: rgba(139, 126, 200, 0.06);  /* 顶部柔和紫光晕 */
  --bg-glow-warm: rgba(255, 138, 92, 0.05); /* 暖橙光晕（珊瑚橙补暖） */
  --card: #FFFFFF;          /* 卡片底 · 白 */
  --surface-2: #F3EFE8;     /* 次级表面 · 暖灰米 */
  --surface-3: #EAE5DB;     /* 三级表面 */
  --scrim: rgba(38, 34, 30, 0.32);

  /* —— 文字 —— */
  --text-1: #26221E;        /* 主文字 · 暖墨（非纯黑） */
  --text-2: #7A746C;        /* 次文字 · 暖灰 */
  --text-3: #A69F94;        /* 弱文字 */
  --text-inverse: #FDFBF7;

  /* —— 边框 —— */
  --border: #EAE6DF;
  --border-strong: #DCD6CB;

  /* —— 品牌 —— */
  --brand: #002FA7;         /* 克莱因蓝 · 学习/专注/目标主色 */
  --brand-strong: #001F6E;
  --brand-soft: rgba(0, 47, 167, 0.10);
  --brand-softer: rgba(0, 47, 167, 0.06);
  --purple: #8B7EC8;        /* 柔和紫 · 养生/冥想/用药 */
  --purple-soft: rgba(139, 126, 200, 0.12);
  --gradient: linear-gradient(135deg, #002FA7 0%, #8B7EC8 100%);

  /* —— 语义色 —— */
  --goal-blue: #4169E1;     /* 宝蓝 · 进度/饮水 */
  --goal-blue-soft: rgba(65, 105, 225, 0.12);
  --life-green: #7BAE7F;    /* 鼠尾草绿 · 生活/习惯/饮食/收入 */
  --life-green-soft: rgba(123, 174, 127, 0.14);
  --expense-red: #FF8A5C;   /* 珊瑚橙 · 训练/支出 */
  --expense-red-soft: rgba(255, 138, 92, 0.12);
  --pause-amber: #D99A2B;
  --pause-amber-soft: rgba(217, 154, 43, 0.14);
  --emotion: #E8849A;         /* 暖粉玫红 · 情绪 */
  --emotion-soft: rgba(232, 132, 154, 0.14);

  /* —— 睡眠（深夜蓝系，入睡仪式 / 三段分色） —— */
  --sleep-night: #1B2A4A;    /* 深夜蓝 · 入睡仪式深色背景 */
  --sleep-seg-deep: #6E5BB8; /* 深睡 */
  --sleep-seg-mid: #8B7EC8;  /* 浅睡 */
  --sleep-seg-light: #BAB0E2;/* REM */

  /* —— 阴影（中性暖灰，去蓝调） —— */
  --shadow-xs: 0 1px 2px rgba(38, 34, 30, 0.05);
  --shadow-sm: 0 2px 10px rgba(38, 34, 30, 0.05);
  --shadow-md: 0 8px 24px rgba(38, 34, 30, 0.08);
  --shadow-lg: 0 18px 44px rgba(38, 34, 30, 0.12);
  --shadow-card: 0 1px 2px rgba(38, 34, 30, 0.04), 0 10px 30px rgba(38, 34, 30, 0.06);
  --shadow-primary: 0 8px 22px rgba(0, 47, 167, 0.20);

  /* —— 圆角 —— */
  --r-sm: 12px;
  --r-md: 16px;
  --r-lg: 20px;
  --r-xl: 24px;
  --r-pill: 999px;

  /* —— 字体 —— */
  --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Helvetica Neue", sans-serif;
  --font-num: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "PingFang SC", monospace;

  /* —— 字号 / 行高 —— */
  --fs-display: 34px;
  --fs-h1: 28px;
  --fs-h2: 20px;
  --fs-h3: 17px;
  --fs-body: 15px;
  --fs-sm: 13px;
  --fs-caption: 12px;

  /* —— 间距 —— */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-8: 32px;

  /* ============ 18. 尺寸 token（全局内容区规范） ============ */
  --icon-sm: 32px;   /* 紧凑小图标 */
  --icon-md: 38px;   /* 标准条目图标容器 */
  --icon-lg: 44px;   /* 概览/量化头大图标 */
  --pad-card: 18px 20px;      /* 标准卡片内边距 */
  --pad-card-sm: 14px 20px;   /* 紧凑卡（设置区/说明卡） */
  --gap-list: 10px;           /* 条目纵向间距 */
  --h-title: 18px;  --h-name: 16px;  --fs-meta: 12px;
  --r-icon: var(--r-lg);      /* 图标容器圆角 20px */

  /* —— 动效 —— */
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-fast: 200ms;
  --dur: 300ms;
  --dur-slow: 400ms;
}

/* ============ 3. DARK TOKENS（夜间 · SleepCore 高级感） ============ */
[data-theme="dark"] {
  color-scheme: dark;

  /* —— 表面（深海军蓝 → 靛蓝 → 深紫渐变，非纯黑） —— */
  --bg: #0D1117;
  --bg-glow-1: rgba(74, 108, 240, 0.16);
  --bg-glow-2: rgba(91, 84, 200, 0.14);
  --card: rgba(255, 255, 255, 0.05);       /* 玻璃拟态 */
  --surface-2: rgba(255, 255, 255, 0.06);
  --surface-3: rgba(255, 255, 255, 0.10);
  --scrim: rgba(4, 6, 12, 0.60);

  /* —— 文字 —— */
  --text-1: #EDEAE4;        /* 暖白 */
  --text-2: #8A8AA0;
  --text-3: #5E5F73;
  --text-inverse: #0D1117;

  /* —— 边框 —— */
  --border: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.14);

  /* —— 品牌（暗色下提亮以保证对比，光晕用低透明度） —— */
  --brand: #4A6CF0;
  --brand-strong: #7A9CF8;
  --brand-soft: rgba(74, 108, 240, 0.16);
  --brand-softer: rgba(74, 108, 240, 0.10);
  --purple: #A79BD8;
  --purple-soft: rgba(167, 155, 216, 0.16);
  --gradient: linear-gradient(135deg, #3B5BDB 0%, #8A7ED0 100%);

  /* —— 语义色 —— */
  --goal-blue: #6E8FE8;
  --goal-blue-soft: rgba(110, 143, 232, 0.16);
  --life-green: #8CBE8E;
  --life-green-soft: rgba(140, 190, 142, 0.16);
  --expense-red: #FF9A75;
  --expense-red-soft: rgba(255, 154, 117, 0.16);
  --pause-amber: #E0AF52;
  --pause-amber-soft: rgba(224, 175, 82, 0.16);
  --emotion: #EFA6BC;
  --emotion-soft: rgba(239, 166, 188, 0.16);

  /* —— 阴影（暗色光晕） —— */
  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.30);
  --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.40);
  --shadow-md: 0 8px 28px rgba(0, 0, 0, 0.50);
  --shadow-lg: 0 18px 48px rgba(0, 0, 0, 0.60);
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.28), 0 10px 32px rgba(0, 0, 0, 0.42);
  --shadow-primary: 0 8px 26px rgba(62, 107, 224, 0.36);
}

/* ============ 4. 全局基础 ============ */
body {
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: 1.6;
  color: var(--text-1);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

/* 环境光晕背景（柔和 · 非纯色） */
.app-stage {
  position: relative;
  min-height: 100vh;
  background:
    radial-gradient(1100px 560px at 50% -12%, var(--bg-glow-1), transparent 62%),
    radial-gradient(760px 420px at 88% -4%, var(--bg-glow-2), transparent 58%),
    radial-gradient(900px 520px at -12% 100%, var(--bg-glow-warm), transparent 62%),
    var(--bg);
}

[data-theme="dark"] .app-stage {
  background:
    radial-gradient(1000px 560px at 18% -8%, var(--bg-glow-1), transparent 58%),
    radial-gradient(900px 520px at 88% 8%, var(--bg-glow-2), transparent 58%),
    linear-gradient(180deg, #0D1117 0%, #141A2E 58%, #1A1530 100%);
}

/* 430px 容器 · 移动端优先 */
.app {
  position: relative;
  max-width: 430px;
  margin: 0 auto;
  min-height: 100vh;
  padding-bottom: calc(148px + env(safe-area-inset-bottom, 0px));
}

/* 桌面呈现：居中 + 侧边框 + 柔和投影，像一台安静的设备 */
@media (min-width: 768px) {
  body { background: #0C0F16; }
  .app-stage {
    background: #0C0F16;
    padding: 32px 0;
  }
  .app {
    min-height: calc(100vh - 64px);
    border-radius: 40px;
    overflow: hidden;
    box-shadow: 0 40px 120px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.06);
    background:
      radial-gradient(1000px 520px at 50% -10%, var(--bg-glow-1), transparent 60%),
      radial-gradient(800px 420px at 88% -4%, var(--bg-glow-2), transparent 56%),
      radial-gradient(900px 520px at -12% 100%, var(--bg-glow-warm), transparent 62%),
      var(--bg);
  }
  [data-theme="dark"] .app {
    background:
      radial-gradient(1000px 560px at 18% -8%, var(--bg-glow-1), transparent 58%),
      radial-gradient(900px 520px at 88% 8%, var(--bg-glow-2), transparent 58%),
      linear-gradient(180deg, #0D1117 0%, #141A2E 58%, #1A1530 100%);
  }
}

/* ============ 5. 排版工具 ============ */
.t-display {
  font-size: var(--fs-display);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.18;
}
.t-h1 { font-size: var(--fs-h1); font-weight: 700; letter-spacing: -0.02em; line-height: 1.24; }
.t-h2 { font-size: var(--fs-h2); font-weight: 650; letter-spacing: -0.01em; line-height: 1.3; }
.t-h3 { font-size: var(--fs-h3); font-weight: 600; line-height: 1.4; }
.t-body { font-size: var(--fs-body); font-weight: 400; line-height: 1.6; }
.t-sm { font-size: var(--fs-sm); font-weight: 400; line-height: 1.55; }
.t-caption { font-size: var(--fs-caption); font-weight: 400; line-height: 1.5; }
.t-num { font-variant-numeric: tabular-nums; font-family: var(--font-num); }
.t-muted { color: var(--text-2); }
.t-faint { color: var(--text-3); }
.t-brand { color: var(--brand); }

/* ============ 6. 布局工具 ============ */
.page { padding: 0 var(--sp-4); }
.stack { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; }
.grow { flex: 1; min-width: 0; }
.gap-2 { gap: var(--sp-2); }
.gap-3 { gap: var(--sp-3); }
.gap-4 { gap: var(--sp-4); }
.space-y-4 > * + * { margin-top: var(--sp-4); }
.space-y-3 > * + * { margin-top: var(--sp-3); }

/* 区块标题（跨页通用 · 标题左 / 计数右） */
.section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
.section-head__title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--text-1); }
.section-head__hint { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.section-head__meta { font-size: 13px; color: var(--text-3); font-variant-numeric: tabular-nums; }

/* ============ 7. 顶栏 ============ */
.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: 14px 16px;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  backdrop-filter: blur(18px) saturate(160%);
}
.topbar__title { flex: 1; text-align: center; font-size: var(--fs-h3); font-weight: 650; }
.topbar__side { width: 36px; display: flex; justify-content: flex-start; }
.topbar__side--right { justify-content: flex-end; }

.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border-radius: var(--r-pill);
  color: var(--text-1);
  transition: background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
.icon-btn:active { transform: scale(0.92); background: var(--surface-2); }
.icon-btn svg { width: 20px; height: 20px; }

/* ============ 8. 按钮 ============ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 52px;
  padding: 0 22px;
  border-radius: var(--r-pill);
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.01em;
  transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur) var(--ease), opacity var(--dur-fast) var(--ease);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.btn:active { transform: scale(0.97); }
.btn svg { width: 20px; height: 20px; }

.btn--primary {
  background: var(--gradient);
  color: #FFFFFF;
  box-shadow: var(--shadow-primary);
}
.btn--primary:hover { box-shadow: 0 10px 28px rgba(0, 47, 167, 0.25); }

.btn--soft {
  background: var(--brand-soft);
  color: var(--brand);
  height: 44px;
  padding: 0 18px;
  font-size: 15px;
}
[data-theme="dark"] .btn--soft { color: var(--brand-strong); }

.btn--ghost {
  background: var(--surface-2);
  color: var(--text-1);
  height: 44px;
  padding: 0 18px;
  font-size: 15px;
}

.btn--sm { height: 38px; padding: 0 16px; font-size: 13px; border-radius: var(--r-pill); }
.btn--sm svg { width: 16px; height: 16px; }
.btn--block { width: 100%; }
.btn:disabled { opacity: 0.45; pointer-events: none; }

/* ============ 9. 输入框 ============ */
.field { display: flex; flex-direction: column; gap: 8px; }
.field__label { font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); }

.input {
  width: 100%;
  height: 50px;
  padding: 0 16px;
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  background: var(--surface-2);
  font-size: 15px;
  color: var(--text-1);
  outline: none;
  transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.input::placeholder { color: var(--text-3); }
.input:focus {
  border-color: var(--brand);
  background: var(--card);
  box-shadow: 0 0 0 4px var(--brand-softer);
}

.textarea {
  width: 100%;
  min-height: 88px;
  padding: 14px 16px;
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  background: var(--surface-2);
  font-size: 15px;
  line-height: 1.6;
  color: var(--text-1);
  outline: none;
  resize: vertical;
  transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.textarea::placeholder { color: var(--text-3); }
.textarea:focus { border-color: var(--brand); background: var(--card); box-shadow: 0 0 0 4px var(--brand-softer); }

/* ============ 10. 卡片 ============ */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  padding: var(--pad-card);
  box-shadow: var(--shadow-card);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
}
.card--inset { background: var(--surface-2); border: 1px solid var(--border); box-shadow: none; }

/* ============ 11. 进度条 ============ */
.progress {
  position: relative;
  height: 8px;
  border-radius: var(--r-pill);
  background: var(--surface-2);
  overflow: hidden;
}
.progress--thin { height: 6px; }
.progress--lg { height: 12px; }
.progress__fill {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0;
  border-radius: var(--r-pill);
  background: var(--gradient);
  transition: width 0.6s var(--ease-out);
}
.progress__fill--green { background: linear-gradient(135deg, #7BAE7F, #5E9A62); }
.progress__fill--blue { background: linear-gradient(135deg, #4169E1, #002FA7); }
.progress__fill--amber { background: linear-gradient(135deg, #E0AF52, #D99A2B); }
[data-theme="dark"] .progress { background: rgba(255, 255, 255, 0.08); }

/* ============ 12. 标签 / 状态 ============ */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 26px;
  padding: 0 10px;
  border-radius: var(--r-pill);
  font-size: var(--fs-caption);
  font-weight: 600;
  line-height: 1;
}
.tag__dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.tag--active { background: var(--life-green-soft); color: #1F9D5C; }
[data-theme="dark"] .tag--active { color: var(--life-green); }
.tag--paused { background: var(--pause-amber-soft); color: var(--pause-amber); }
.tag--done { background: var(--brand-soft); color: var(--brand); }
[data-theme="dark"] .tag--done { color: var(--brand-strong); }

/* 过滤胶囊 */
.chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 2px 0;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto;
  height: 38px;
  padding: 0 18px;
  border-radius: var(--r-pill);
  font-size: 14px;
  font-weight: 550;
  color: var(--text-2);
  background: var(--surface-2);
  border: 1px solid transparent;
  transition: all var(--dur-fast) var(--ease);
}
.chip.is-active {
  color: #FFFFFF;
  background: var(--gradient);
  box-shadow: var(--shadow-primary);
}

/* ============ 13. 底部导航 ============ */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 430px;
  z-index: 40;
  display: flex;
  padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--bg) 78%, transparent);
  border-top: 1px solid var(--border);
  -webkit-backdrop-filter: blur(22px) saturate(180%);
  backdrop-filter: blur(22px) saturate(180%);
}
@media (min-width: 768px) {
  .bottom-nav { bottom: 32px; border-radius: 0 0 40px 40px; }
}
.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 6px 0;
  border-radius: var(--r-md);
  color: var(--text-3);
  transition: color var(--dur) var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.nav-item svg { width: 22px; height: 22px; }
.nav-item__label { font-size: 11px; font-weight: 550; line-height: 1; }
.nav-item.is-active { color: var(--brand); }
.nav-item.is-active .nav-item__icon {
  position: relative;
}
.nav-item.is-active .nav-item__icon::after {
  content: '';
  position: absolute;
  left: 50%;
  bottom: -7px;
  transform: translateX(-50%);
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--gradient);
}

/* ============ 13.5 全局悬浮球（AI 助手入口） ============ */
.fab-wrap {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 430px;
  bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  display: flex;
  justify-content: flex-end;
  padding: 0 16px;
  pointer-events: none;
  z-index: 45;
}
@media (min-width: 768px) {
  .fab-wrap { bottom: 116px; }
}
.fab {
  pointer-events: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--gradient);
  color: #FFFFFF;
  box-shadow: 0 8px 24px rgba(0, 47, 167, 0.28);
  animation: breath 3.2s var(--ease) infinite;
  transition: transform var(--dur-fast) var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.fab:active { transform: scale(0.88); }
.fab svg { width: 24px; height: 24px; }

/* ============ 14. 弹层 ============ */
.sheet {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  pointer-events: none;
}
.sheet.is-open { pointer-events: auto; }
.sheet__scrim {
  position: absolute;
  inset: 0;
  background: var(--scrim);
  opacity: 0;
  transition: opacity var(--dur) var(--ease);
  -webkit-backdrop-filter: blur(8px) saturate(1.15);
  backdrop-filter: blur(8px) saturate(1.15);
}
.sheet__panel {
  position: relative;
  width: 100%;
  max-width: 430px;
  max-height: 88vh;
  overflow-y: auto;
  background: var(--card);
  border-radius: 24px 24px 0 0;
  border-top: 1px solid var(--border);
  padding: 16px 20px calc(20px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -8px 32px rgba(15, 23, 42, 0.10), var(--shadow-lg);
  transform: translateY(100%);
  transition: transform var(--dur-slow) cubic-bezier(0.32, 0.72, 0, 1);
}
.sheet.is-open .sheet__panel { transform: translateY(0) scale(1); }
[data-theme="dark"] .sheet__panel {
  box-shadow: 0 -8px 32px rgba(15, 23, 42, 0.18), var(--shadow-lg);
}
.sheet__grip {
  width: 48px;
  height: 5px;
  border-radius: var(--r-pill);
  background: var(--text-3);
  opacity: 0.55;
  margin: 0 auto 14px;
}
.sheet__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.sheet__title {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--text-1);
}
.sheet__close {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-3);
  background: var(--surface-2);
  -webkit-tap-highlight-color: transparent;
}
.sheet__close svg { width: 17px; height: 17px; }
.sheet__actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}
.sheet__actions .btn { flex: 1; }
.sheet.is-open .sheet__scrim { opacity: 1; }
.sheet.is-open .sheet__panel { transform: translateY(0) scale(1); }

/* ============ 15. 空状态 ============ */
.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 72px 28px;
  gap: 16px;
}
.empty__art {
  width: 108px;
  height: 108px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--brand-softer);
  color: var(--brand);
  margin-bottom: 4px;
}
.empty__art svg { width: 44px; height: 44px; }
.empty__title { font-size: var(--fs-h3); font-weight: 650; color: var(--text-1); }
.empty__desc { font-size: var(--fs-sm); color: var(--text-2); max-width: 260px; line-height: 1.7; }
.empty .btn { margin-top: 8px; }

/* ============ 16. 光晕 / 玻璃 ============ */
.glow-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(64px);
  pointer-events: none;
  z-index: 0;
}

.glass {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.10);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
}

/* ============ 17. 动效 ============ */
@keyframes breath {
  0%, 100% { transform: scale(1); opacity: 0.85; }
  50% { transform: scale(1.06); opacity: 1; }
}
@keyframes breathe-dots {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
  40% { transform: scale(1); opacity: 1; }
}
@keyframes fade-up {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes shimmer {
  0% { background-position: -400px 0; }
  100% { background-position: 400px 0; }
}

.breath { animation: breath 2.4s var(--ease) infinite; }

/* AI 生成呼吸状态 */
.ai-generating { display: flex; align-items: center; gap: 6px; }
.ai-generating__dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--brand);
  animation: breathe-dots 1.2s var(--ease) infinite;
}
.ai-generating__dot:nth-child(2) { animation-delay: 0.15s; }
.ai-generating__dot:nth-child(3) { animation-delay: 0.3s; }

/* 骨架屏 */
.skeleton {
  border-radius: var(--r-md);
  background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 50%, var(--surface-2) 75%);
  background-size: 400px 100%;
  animation: shimmer 1.4s linear infinite;
}

.fade-up { animation: fade-up 0.5s var(--ease-out) both; }
.fade-up--1 { animation-delay: 0.03s; }
.fade-up--2 { animation-delay: 0.08s; }
.fade-up--3 { animation-delay: 0.13s; }

/* 折叠区 */
.collapse__head {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 4px 0;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.collapse__chevron {
  transition: transform var(--dur) var(--ease);
  color: var(--text-3);
}
.collapse__chevron svg { width: 18px; height: 18px; }
.collapse.is-open .collapse__chevron { transform: rotate(180deg); }
.collapse__body {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows var(--dur-slow) var(--ease);
}
.collapse__body > div { overflow: hidden; }
.collapse.is-open .collapse__body { grid-template-rows: 1fr; }

/* 开关 */
.switch {
  position: relative;
  width: 48px;
  height: 28px;
  border-radius: var(--r-pill);
  background: var(--surface-3);
  transition: background var(--dur) var(--ease);
  flex: 0 0 auto;
}
.switch::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #FFFFFF;
  box-shadow: 0 2px 6px rgba(38, 34, 30, 0.14);
  transition: transform var(--dur) var(--ease-out);
}
.switch.is-on { background: var(--gradient); }
.switch.is-on::after { transform: translateX(20px); }

/* 复选框（圆润） */
.check {
  width: 26px;
  height: 26px;
  border-radius: 9px;
  border: 2px solid var(--border-strong);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  color: transparent;
  transition: all var(--dur-fast) var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.check svg { width: 15px; height: 15px; }
.check.is-done {
  background: var(--gradient);
  border-color: transparent;
  color: #FFFFFF;
}

/* stepper 步进器 */
.stepper {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-pill);
  padding: 3px;
}
.stepper__btn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-2);
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.stepper__btn:active { background: var(--surface-3); color: var(--text-1); }
.stepper__btn svg { width: 16px; height: 16px; }
.stepper__val { min-width: 40px; text-align: center; font-weight: 650; font-variant-numeric: tabular-nums; }

/* Toast */
.toast {
  position: fixed;
  left: 50%;
  bottom: 110px;
  transform: translateX(-50%) translateY(16px);
  padding: 11px 22px;
  border-radius: var(--r-pill);
  font-size: var(--fs-sm);
  font-weight: 600;
  color: #FFFFFF;
  background: var(--gradient);
  box-shadow: var(--shadow-primary);
  opacity: 0;
  pointer-events: none;
  transition: all var(--dur) var(--ease-out);
  z-index: 100;
  white-space: nowrap;
}
.toast.is-show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 分割线 */
.divider { height: 1px; background: var(--border); border: 0; }

/* 工具 */
.is-hidden { display: none !important; }
.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

/* ============ 18.5 语义色分工规范（跨模块统一） ============ */
/*
  模块色：
    训练 = --expense-red（珊瑚橙）
    饮水 = --goal-blue（宝蓝）
    睡眠 = --purple（柔和紫）
    饮食 = --life-green（鼠尾草绿）
    久坐/姿态 = --purple（柔和紫）
    养生/功法 = --life-green（鼠尾草绿）
    吃药 = --purple（柔和紫）
    记账 = --goal-blue（宝蓝）
    专注/品牌 = --brand（克莱因蓝）
  状态色（跨模块统一）：
    达标/完成 = --life-green
    预警/超支 = --pause-amber
    品牌/主按钮 = --brand
*/

/* ============ 19. 条目/图标组件（全局唯一标准） ============ */
/* 图标容器：.icon-box 为全局唯一图标容器标准 */
.icon-box {
  width: var(--icon-md);
  height: var(--icon-md);
  border-radius: var(--r-icon);
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  background: var(--surface-2);
  color: var(--text-2);
}
.icon-box svg { width: 19px; height: 19px; }
.icon-box--lg { width: var(--icon-lg); height: var(--icon-lg); }
.icon-box--lg svg { width: 22px; height: 22px; }
.icon-box--sm { width: var(--icon-sm); height: var(--icon-sm); }
.icon-box--sm svg { width: 16px; height: 16px; }
/* 语义色变体 */
.icon-box--strength { background: var(--expense-red-soft); color: var(--expense-red); }
.icon-box--water { background: var(--goal-blue-soft); color: var(--goal-blue); }
.icon-box--sleep { background: var(--purple-soft); color: var(--purple); }
.icon-box--life { background: var(--life-green-soft); color: var(--life-green); }
.icon-box--brand { background: var(--brand-soft); color: var(--brand); }
.icon-box--amber { background: var(--pause-amber-soft); color: var(--pause-amber); }
.icon-box--emotion { background: var(--emotion-soft); color: var(--emotion); }
[data-theme="dark"] .icon-box--strength { color: var(--expense-red); }
[data-theme="dark"] .icon-box--water { color: var(--goal-blue); }
[data-theme="dark"] .icon-box--sleep { color: var(--purple); }
[data-theme="dark"] .icon-box--life { color: var(--life-green); }
[data-theme="dark"] .icon-box--brand { color: var(--brand-strong); }
[data-theme="dark"] .icon-box--amber { color: var(--pause-amber); }
[data-theme="dark"] .icon-box--emotion { color: var(--emotion); }

/* 通用条目骨架：.item-row 为全局唯一条目标准 */
.item-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 4px 0;
}
.item-row__main { flex: 1; min-width: 0; }
.item-row__name {
  font-size: var(--h-name);
  font-weight: 650;
  letter-spacing: -0.01em;
  color: var(--text-1);
}
.item-row__meta {
  font-size: var(--fs-meta);
  color: var(--text-3);
  margin-top: 2px;
  line-height: 1.5;
}
.item-row__val {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-1);
  font-variant-numeric: tabular-nums;
  flex: 0 0 auto;
}

/* ============ 20. 状态/交互类（跨页统一） ============ */
/* 完成态工具类：左侧色条变浅绿 + 绿图标 + 绿文字 + opacity 0.6 */
.is-done { opacity: 0.6; }
.is-done::before { background: var(--life-green) !important; }
.is-done > .icon-box,
.is-done .icon-box {
  background: var(--life-green-soft) !important;
  color: var(--life-green) !important;
}
.is-done .item-row__name { color: var(--life-green) !important; }
.is-done .ev__focus { background: var(--life-green-soft) !important; color: var(--life-green) !important; }
.is-done__note {
  display: flex;
  align-items: center;
  gap: 3px;
  font-size: 11px;
  color: var(--life-green);
  margin-top: 2px;
}
.is-done__note svg { width: 11px; height: 11px; }

/* chip 扩展变体 */
.chip--custom { border-style: dashed; }
.chip--custom.is-active {
  background: var(--brand-soft);
  border-color: var(--brand);
  border-style: solid;
  color: var(--brand);
}
[data-theme="dark"] .chip--custom.is-active { color: var(--brand-strong); }
.chips--my .chip { position: relative; }
.chips--my .chip.is-longpress::after {
  content: '×';
  position: absolute;
  top: -6px;
  right: -6px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--expense-red);
  color: #FFFFFF;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  line-height: 1;
}

/* ============ 21. 跨页联动模式（规范注释） ============ */
/*
  跨页状态同步统一模式：
  1. 数据源：localStorage.setItem('lifeflow-<mod>-<key>', JSON.stringify({date, ...}))
  2. 写入：保存后立即 dispatchEvent(new CustomEvent('<mod>-updated', { detail }))
  3. 读取：消费方 read → 按 date 校验今天 → 应用状态
  4. 监听：addEventListener('<mod>-updated') + addEventListener('storage' 按 key)
     + addEventListener('visibilitychange')（切回页面刷新，防漏事件）
  5. 事件命名：<mod>-updated（train-updated / water-updated / habit-updated）
  6. 数据结构：跨页状态用 {date, typesDone:[类型名], typeTimes:{类型名:HH:MM}, ...}
     代替单纯 {done:[项目名]}（typesDone 适合"按类型聚合"——一个类型完成一次即标完成）
*/

/* 无障碍：减少动效 */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

<script>
(function () {
  'use strict';
  var toast = document.getElementById('toast');
  var toastTimer;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('is-show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('is-show'); }, 1800);
  }

  /* 主题 */
  var LS_THEME = 'lifeflow-theme';
  var root = document.documentElement;
  function applyTheme(t) {
    root.setAttribute('data-theme', t);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) { meta.setAttribute('content', t === 'dark' ? '#0D1117' : '#F7F4EF'); }
    var icon = document.querySelector('#theme-toggle i');
    if (icon) { icon.setAttribute('data-lucide', t === 'dark' ? 'sun' : 'moon'); }
    if (window.lucide) { window.lucide.createIcons(); }
  }
  var saved = null;
  try { saved = localStorage.getItem(LS_THEME); } catch (e) {}
  if (saved) { applyTheme(saved); }
  var toggleBtn = document.getElementById('theme-toggle');
  if (toggleBtn) {
    toggleBtn.addEventListener('click', function () {
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      try { localStorage.setItem(LS_THEME, next); } catch (e) {}
    });
  }

  document.addEventListener('click', function (e) {
    var hrefEl = e.target.closest('[data-href]');
    if (hrefEl) { location.href = hrefEl.getAttribute('data-href'); }
  });

  /* 添加阶段 */
  var stageCount = 1;
  var stageList = document.getElementById('stage-list');
  document.getElementById('add-stage').addEventListener('click', function () {
    if (stageCount >= 3) { showToast('最多添加 3 个阶段'); return; }
    stageCount++;
    var row = document.createElement('div');
    row.className = 'stage-row';
    row.innerHTML = '<input class="edit-input" type="text" placeholder="阶段名称" aria-label="阶段名称">' +
      '<input class="edit-input stage-date" type="text" placeholder="预计完成日" aria-label="预计完成日">' +
      '<button type="button" class="stage-remove" aria-label="删除"><i data-lucide="trash-2"></i></button>';
    stageList.appendChild(row);
    if (window.lucide) { window.lucide.createIcons(); }
  });

  /* 删除阶段 */
  stageList.addEventListener('click', function (e) {
    var rm = e.target.closest('.stage-remove');
    if (rm) {
      rm.closest('.stage-row').remove();
      stageCount--;
      if (window.lucide) { window.lucide.createIcons(); }
    }
  });

  /* 高级设置折叠 */
  var fold = document.getElementById('fold-advanced');
  document.getElementById('fold-toggle').addEventListener('click', function () {
    fold.classList.toggle('is-open');
    if (window.lucide) { window.lucide.createIcons(); }
  });

  /* ══════════════════════════════════════════════════════════════
     持久化层（本次新增）—— 改造前 #confirm-btn **只弹成功遮罩 + 跳转**：
     表单里写的目标名称 / 阶段 / 今天的第一步 / 关键结果一个都没存 ⟹ 建完就丢，
     回到 goals.html 依然是那 5 张写死的卡。
     现在：按 3 层表单组装成一条目标写盘，再广播。

       lifeflow-goal-items = { v:1, items:[ {
         id, domId, title, status, domain, domainIcon,
         days, deadline, progress, bar, pct,
         measure, summary, nextStep, today, step, strategy,
         stages:[ { id, name, meta, date, state } ],
         tasks: [ { id, name, meta, done } ]
       } ] }
       —— 三层：目标(名称) → 阶段(名称 + 预计完成日) → 今天的第一步
       ⚠ 本页**只追加**，不播种（与 expense-create / note-create 同口径）：
         存储不可用时退化为空表，不阻塞下面的成功态。
     ══════════════════════════════════════════════════════════════ */
  var K_GOALS = 'lifeflow-goal-items';
  var SCHEMA_V = 1;

  function loadGoals() {
    if (window.LightGoals) {
      window.LightGoals.migrate();
      return window.LightGoals.list();
    }
    try {
      var raw = localStorage.getItem(K_GOALS);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && d.v === SCHEMA_V && Array.isArray(d.items)) { return d.items; }
      }
    } catch (e) {}
    return [];
  }
  function saveGoals(list) {
    try {
      if (window.LightGoals) {
        list.forEach(function (g) { window.LightGoals.save(g); });
      }
      window.dispatchEvent(new CustomEvent('goal-updated', { detail: { items: list } }));
    } catch (e) { /* 忽略：无存储时仍走成功态，不阻塞用户 */ }
  }

  /* 模块要求：表单行 ↔ requirements[] */
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function moduleOptions(cur) {
    var mods = (window.LightGoals && window.LightGoals.MODULES) || [
      { id: 'sleep', label: '睡眠' }, { id: 'diet', label: '饮食' }, { id: 'water', label: '饮水' },
      { id: 'training', label: '训练' }, { id: 'study', label: '学习' }, { id: 'mood', label: '情绪' },
      { id: 'expense', label: '记账' }, { id: 'other', label: '其他' }
    ];
    return mods.map(function (m) {
      return '<option value="' + m.id + '"' + (m.id === cur ? ' selected' : '') + '>' + m.label + '</option>';
    }).join('');
  }
  function reqRowHTML(r) {
    r = r || {};
    if (!r.metric) {
      var d = window.LightGoals ? window.LightGoals.defaultsFor(r.moduleId || 'sleep') : { metric: 'hours', unit: 'h', target: 7 };
      r = Object.assign({}, d, r);
    }
    return '<div class="req-row">' +
      '<div class="req-row__top">' +
        '<select class="edit-input" data-f="module" aria-label="模块">' + moduleOptions(r.moduleId || 'sleep') + '</select>' +
        '<input class="edit-input" data-f="metric" value="' + esc(r.metric || '') + '" placeholder="指标 hours" aria-label="指标">' +
        '<button type="button" class="req-del" data-del-req aria-label="删除">×</button>' +
      '</div>' +
      '<div class="req-row__bottom">' +
        '<input class="edit-input" data-f="target" type="number" min="0" step="0.1" value="' + (r.target != null ? r.target : '') + '" placeholder="目标" aria-label="目标">' +
        '<input class="edit-input" data-f="unit" value="' + esc(r.unit || '') + '" placeholder="单位" aria-label="单位">' +
        '<select class="edit-input" data-f="cadence" aria-label="周期">' +
          '<option value="daily"' + (r.cadence === 'daily' ? ' selected' : '') + '>每天</option>' +
          '<option value="weekly"' + (r.cadence === 'weekly' ? ' selected' : '') + '>每周</option>' +
        '</select>' +
        '<select class="edit-input" data-f="direction" aria-label="方向">' +
          '<option value="at_least"' + (r.direction !== 'at_most' ? ' selected' : '') + '>至少</option>' +
          '<option value="at_most"' + (r.direction === 'at_most' ? ' selected' : '') + '>最多</option>' +
        '</select>' +
      '</div>' +
    '</div>';
  }
  function addReqRow(r) {
    var box = document.getElementById('req-list');
    if (!box) return;
    box.insertAdjacentHTML('beforeend', reqRowHTML(r));
  }
  function collectRequirements() {
    var out = [];
    Array.prototype.forEach.call(document.querySelectorAll('#req-list .req-row'), function (row, i) {
      var moduleId = row.querySelector('[data-f="module"]').value;
      var target = Number(row.querySelector('[data-f="target"]').value);
      if (!isFinite(target) || target <= 0) return;
      out.push({
        id: 'req-' + Date.now() + '-' + i,
        moduleId: moduleId,
        metric: row.querySelector('[data-f="metric"]').value.trim() || 'count',
        target: target,
        unit: row.querySelector('[data-f="unit"]').value.trim(),
        cadence: row.querySelector('[data-f="cadence"]').value,
        direction: row.querySelector('[data-f="direction"]').value,
        role: 'required',
        source: 'goal'
      });
    });
    return out;
  }
  document.getElementById('add-req').addEventListener('click', function () { addReqRow({}); });
  document.getElementById('req-list').addEventListener('change', function (e) {
    if (!e.target.matches('[data-f="module"]')) return;
    var row = e.target.closest('.req-row');
    var d = window.LightGoals ? window.LightGoals.defaultsFor(e.target.value) : null;
    if (!d) return;
    row.querySelector('[data-f="metric"]').value = d.metric;
    row.querySelector('[data-f="unit"]').value = d.unit;
    row.querySelector('[data-f="target"]').value = d.target;
  });
  document.getElementById('req-list').addEventListener('click', function (e) {
    var b = e.target.closest('[data-del-req]');
    if (b) b.closest('.req-row').remove();
  });

  /* 第 2 层：阶段行 → stages[]（空行不落盘；第一个阶段是"当前阶段"） */
  function collectStages() {
    var out = [];
    Array.prototype.forEach.call(document.querySelectorAll('#stage-list .stage-row'), function (row) {
      var inputs = row.querySelectorAll('input');
      var name = inputs[0] ? inputs[0].value.trim() : '';
      var date = inputs[1] ? inputs[1].value.trim() : '';
      if (!name && !date) { return; }
      out.push({
        id: 'st' + (out.length + 1),
        name: name,
        meta: '',
        date: date,
        state: out.length === 0 ? 'active' : 'todo'
      });
    });
    return out;
  }

  /* 确认创建：组装 schema → 写盘 → 广播 → 成功遮罩 → 跳回列表 */
  var overlay = document.getElementById('success-overlay');
  document.getElementById('confirm-btn').addEventListener('click', function () {
    var name = document.getElementById('goal-name').value.trim();
    if (!name) { showToast('先写一句话说清目标吧'); return; }

    var nameEl = document.getElementById('first-step');
    var notesEl = document.getElementById('advanced-notes');
    var firstStep = nameEl ? nameEl.value.trim() : '';
    var notes = notesEl ? notesEl.value.trim() : '';
    var stages = collectStages();
    /* 截止日取最后一个填了日期的阶段（表单里没有单独的截止字段） */
    var deadline = null;
    for (var i = stages.length - 1; i >= 0; i--) {
      if (stages[i].date) { deadline = stages[i].date; break; }
    }

    var id = 'g' + Date.now();
    var items = loadGoals();
    items.push({
      id: id, domId: 'goal-card-' + id,
      title: name,
      status: 'active', domain: '自定义', domainIcon: 'target',
      days: 0, deadline: deadline, progress: 0, bar: '', pct: '',
      measure: null,
      summary: null,
      nextStep: firstStep || '从今天的第一步开始',
      today: { icon: 'circle', text: '今日未开始', full: false },
      step: { title: firstStep || name, sub: '', startedAt: null },
      strategy: notes,
      stages: stages,
      tasks: [],
      requirements: collectRequirements(),
      priority: 3,
      primary: false
    });
    saveGoals(items);

    overlay.classList.add('is-show');
    setTimeout(function () { location.href = 'goals.html'; }, 1400);
  });

  if (window.lucide) { window.lucide.createIcons(); }
})();
</script>
<style>
  /* ===== 目标创建页 · 3 层表单 ===== */
  .create-body { padding: 8px 16px 0; display: flex; flex-direction: column; gap: 20px; }

  /* 页头 */
  .create-intro { padding: 12px 4px 0; }
  .create-intro__title { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.3; }
  .create-intro__sub { font-size: 14px; color: var(--text-2); margin-top: 6px; line-height: 1.6; }

  /* 表单区块 */
  .form-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--r-xl);
    padding: 18px 16px;
    box-shadow: var(--shadow-card);
  }
  .form-section__label {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 650; color: var(--text-3);
    margin-bottom: 12px;
  }
  .form-section__label svg { width: 14px; height: 14px; }
  .form-section__step {
    width: 22px; height: 22px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: #FFFFFF;
    background: var(--gradient); flex: 0 0 auto;
  }

  .edit-input {
    width: 100%; padding: 11px 14px; border-radius: var(--r-md);
    border: 1px solid var(--border); background: var(--surface-2);
    font-size: 14px; line-height: 1.55; color: var(--text-1); outline: none;
    transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
  }
  .edit-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-softer); background: var(--card); }
  .edit-input::placeholder { color: var(--text-3); }

  /* 阶段目标行 */
  .stage-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .stage-row .edit-input { flex: 1; min-width: 0; }
  .stage-row .stage-date { width: 110px; flex: 0 0 auto; }
  .stage-remove {
    display: flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 10px; flex: 0 0 auto;
    color: var(--text-3); transition: all var(--dur-fast) var(--ease);
  }
  .stage-remove:active { background: var(--expense-red-soft); color: var(--expense-red); }
  .stage-remove svg { width: 16px; height: 16px; }

  .add-btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 40px; padding: 0 14px; border-radius: var(--r-pill);
    font-size: 13px; font-weight: 600; color: var(--brand);
    background: var(--brand-softer);
    transition: all var(--dur-fast) var(--ease);
    -webkit-tap-highlight-color: transparent;
  }
  .add-btn svg { width: 15px; height: 15px; }
  .add-btn:active { opacity: 0.75; }
  [data-theme="dark"] .add-btn { color: var(--brand-strong); }

  /* 高级设置折叠 */
  .fold {
    border: 1px solid var(--border);
    border-radius: var(--r-xl);
    background: var(--card);
    box-shadow: var(--shadow-card);
    overflow: hidden;
  }
  .fold__toggle {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 14px 16px;
    font-size: 13px; font-weight: 600; color: var(--text-3);
    transition: background var(--dur-fast) var(--ease);
    -webkit-tap-highlight-color: transparent;
    text-align: left;
  }
  .fold__toggle:active { background: var(--surface-2); }
  .fold__toggle svg { width: 16px; height: 16px; color: var(--text-3); }
  .fold__toggle .fold__arrow { margin-left: auto; transition: transform var(--dur-fast) var(--ease); }
  .fold__body { display: none; padding: 0 16px 16px; }
  .fold.is-open .fold__body { display: block; }
  .fold.is-open .fold__arrow { transform: rotate(180deg); }

  /* 确认按钮 */
  .confirm-bar {
    position: sticky; bottom: 0; z-index: 20;
    padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--bg) 92%, transparent) 40%);
  }

  /* 成功遮罩 */
  .success-overlay {
    position: fixed; inset: 0; z-index: 80;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; background: color-mix(in srgb, var(--bg) 92%, transparent);
    -webkit-backdrop-filter: blur(18px);
    backdrop-filter: blur(18px);
    opacity: 0; pointer-events: none;
    transition: opacity var(--dur-slow) var(--ease);
  }
  .success-overlay.is-show { opacity: 1; pointer-events: auto; }
  .success-check {
    width: 96px; height: 96px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--gradient); color: #FFFFFF;
    box-shadow: var(--shadow-primary);
    animation: breath 1.8s var(--ease) infinite;
  }
  .success-check svg { width: 44px; height: 44px; }
  .success-overlay__title { font-size: 20px; font-weight: 700; color: var(--text-1); }
  .success-overlay__sub { font-size: 14px; color: var(--text-2); }

  .hr { border: 0; border-top: 1px solid var(--border); margin: 6px 0; }

  /* 模块要求行 */
  .req-hint { font-size: 12px; line-height: 1.6; color: var(--text-3); margin: 0 0 10px; }
  .req-row { border: 1px solid var(--border); border-radius: 14px; padding: 10px; margin-bottom: 10px; background: var(--surface-2); }
  .req-row__top { display: grid; grid-template-columns: 1.05fr 1fr 30px; gap: 7px; align-items: center; }
  .req-row__bottom { display: grid; grid-template-columns: 1fr .8fr 1fr 1fr; gap: 7px; margin-top: 7px; }
  .req-row .edit-input { height: 36px; font-size: 12px; padding: 0 8px; min-width: 0; }
  .req-row select.edit-input { appearance: none; }
  .req-del { width: 30px; height: 30px; border: 0; border-radius: 50%; background: transparent; color: var(--text-3); font-size: 16px; }
  .req-empty { font-size: 12px; color: var(--text-3); padding: 8px 2px; }
</style>
</body>
</html>
