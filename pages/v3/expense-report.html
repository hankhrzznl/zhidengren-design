<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>月报 · 执灯人</title>
<style>
  :root{
    --bg:#0B0F1A; --card:#121826; --sheet:#1A2332; --line:rgba(232,234,242,.08);
    --text-1:#E8EAF2; --text-2:#9AA3B5; --text-3:#5A6478;
    --brand:#4DC3FF; --red:#FF5C4D; --green:#3EB575;
  }
  [data-theme="light"]{
    --bg:#F7F4EF; --card:#FFFFFF; --sheet:#F2ECE3; --line:rgba(38,34,30,.10);
    --text-1:#26221E; --text-2:#6E675E; --text-3:#A39C90;
    --brand:#002FA7; --red:#D64545; --green:#2F8F5B;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text-1);font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;padding:20px 16px 40px}
  .head{display:flex;align-items:baseline;gap:10px;margin:2px 0 6px}
  .head a{font-size:12px;color:var(--text-3);text-decoration:none}
  .head h1{font-size:22px;margin:0;letter-spacing:.02em}
  .month-nav{display:flex;align-items:center;justify-content:space-between;margin:8px 0 14px;font-size:13px;color:var(--text-2)}
  .month-nav button{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text-1);font-size:15px;cursor:pointer}
  .sum{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
  .sum .lab{font-size:11px;color:var(--text-3);letter-spacing:.14em}
  .sum .big{font-size:38px;font-weight:650;line-height:1.1;margin:6px 0 10px;font-variant-numeric:tabular-nums}
  .sum .row{display:flex;gap:16px;font-size:11.5px;color:var(--text-2)}
  .sum .row b{display:block;font-size:14px;color:var(--text-1);margin-top:2px;font-variant-numeric:tabular-nums}
  .sum .row .in b{color:var(--green)}
  .sum .row .bal b{color:var(--brand)}
  .sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 9px}
  .sec h2{font-size:12px;margin:0;color:var(--text-3);letter-spacing:.16em;font-weight:600}
  .sec span{font-size:11px;color:var(--text-3)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
  .trend{display:flex;align-items:flex-end;gap:10px;height:120px;padding:4px 2px 0}
  .tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;min-width:0}
  .tb i{width:100%;max-width:26px;border-radius:6px 6px 3px 3px;background:var(--sheet);min-height:3px;transition:height .2s}
  .tb.on i{background:var(--brand)}
  .tb em{font-style:normal;font-size:10px;color:var(--text-3);white-space:nowrap}
  .tb.on em{color:var(--text-1)}
  .cat{display:flex;flex-direction:column;gap:10px}
  .cat-row{font-size:12px}
  .cat-top{display:flex;justify-content:space-between;color:var(--text-2);margin-bottom:5px}
  .cat-top b{color:var(--text-1);font-variant-numeric:tabular-nums}
  .cat-bar{height:5px;border-radius:99px;background:var(--sheet);overflow:hidden}
  .cat-bar i{display:block;height:100%;border-radius:99px;background:var(--brand);opacity:.85}
  .acc-row{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--text-2)}
  .acc-row:first-child{border-top:0;padding-top:0}
  .acc-row b{color:var(--text-1);font-variant-numeric:tabular-nums}
  .empty{padding:18px;text-align:center;color:var(--text-3);font-size:12px;border:1px dashed var(--line);border-radius:12px}
  .plan-row{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--text-2)}
  .plan-row:first-child{border-top:0;padding-top:0}
  .plan-row b{color:var(--text-1);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
  <div class="head"><a href="expense.html">← 记账</a><h1>月报</h1></div>

  <div class="month-nav">
    <button type="button" id="prev" aria-label="上个月">‹</button>
    <span id="month-label">2026 年 10 月</span>
    <button type="button" id="next" aria-label="下个月">›</button>
  </div>

  <div class="sum">
    <div class="lab">本月支出</div>
    <div class="big" id="sum-expense">¥0</div>
    <div class="row">
      <div class="in">收入<b id="sum-income">¥0</b></div>
      <div class="bal">结余<b id="sum-balance">¥0</b></div>
    </div>
  </div>

  <div class="sec"><h2>近 6 个月</h2><span>支出</span></div>
  <div class="card"><div class="trend" id="trend"></div></div>

  <div class="sec"><h2>分类</h2><span id="cat-sum"></span></div>
  <div class="card"><div class="cat" id="cat-list"></div></div>

  <div class="sec"><h2>账户</h2><span>支出</span></div>
  <div class="card" id="acc-list"></div>

  <div class="sec"><h2>分期</h2><span id="plan-sum"></span></div>
  <div class="card" id="plan-list"></div>

<script src="../core/store.js"></script>
<script src="../core/ledger.js"></script>
<script>
(function () {
  var L = window.LightLedger;
  var $ = function (s) { return document.querySelector(s); };
  var params = new URLSearchParams(location.search);
  var month = params.get('m') || L.monthKey();

  function money(n) {
    n = Number(n) || 0;
    var sign = n < 0 ? '−' : '';
    return sign + '¥' + (Math.round(Math.abs(n) * 100) / 100).toLocaleString('zh-CN', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  }
  function monthLabel(mk) {
    var p = mk.split('-');
    return p[0] + ' 年 ' + p[1] + ' 月';
  }
  function shift(delta) {
    var d = L.addMonths(month + '-1', delta);
    month = d.slice(0, d.lastIndexOf('-'));
    history.replaceState(null, '', '?m=' + month);
    render();
  }

  function render() {
    $('#month-label').textContent = monthLabel(month);
    var s = L.monthSummary(month);
    $('#sum-expense').textContent = money(s.expense);
    $('#sum-income').textContent = money(s.income);
    $('#sum-balance').textContent = money(s.balance);

    /* 近 6 个月趋势：以当前查看月为终点 */
    var trend = L.monthlyTrend(6, month);
    var max = Math.max.apply(null, trend.map(function (x) { return x.expense; }).concat([1]));
    $('#trend').innerHTML = trend.map(function (x) {
      var h = Math.max(3, Math.round(x.expense / max * 100));
      var on = x.month === month;
      return '<div class="tb' + (on ? ' on' : '') + '" title="' + x.month + ' ' + money(x.expense) + '"><i style="height:' + h + '%"></i><em>' + x.label + '</em></div>';
    }).join('');

    $('#cat-sum').textContent = s.byCategory.length ? (s.byCategory.length + ' 类') : '';
    $('#cat-list').innerHTML = s.byCategory.length ? s.byCategory.map(function (c) {
      return '<div class="cat-row"><div class="cat-top"><span>' + c.category + '</span><b>' + money(c.amount) + ' · ' + c.share + '%</b></div><div class="cat-bar"><i style="width:' + c.share + '%"></i></div></div>';
    }).join('') : '<div class="empty">这个月还没有支出。</div>';

    $('#acc-list').innerHTML = s.byAccount.length ? s.byAccount.map(function (a) {
      return '<div class="acc-row"><span>' + a.name + '</span><b>' + money(a.amount) + '</b></div>';
    }).join('') : '<div class="empty">这个月还没有账户流水。</div>';

    var plans = L.plans();
    var remain = plans.reduce(function (n, p) { return n + L.planRemaining(p); }, 0);
    $('#plan-sum').textContent = plans.length ? ('剩 ' + money(remain)) : '';
    $('#plan-list').innerHTML = plans.length ? plans.map(function (p) {
      var acc = L.accountById(L.load(), p.accountId);
      var done = p.paid >= p.periods;
      return '<div class="plan-row"><span>' + (acc ? acc.name : '信用') + ' · ' + p.name + '（' + p.paid + '/' + p.periods + '）</span><b>' + (done ? '已还清' : money(p.monthly) + ' × ' + (p.periods - p.paid)) + '</b></div>';
    }).join('') : '<div class="empty">还没有分期。</div>';
  }

  $('#prev').addEventListener('click', function () { shift(-1); });
  $('#next').addEventListener('click', function () { shift(1); });

  L.autoRepayDue();
  render();
})();
</script>
</body>
</html>
